[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "forestseg"
description = "Supervised forest extraction pipeline for KH-4 satellite imagery, with spectral / texture priors, deep learning, and RL-driven fusion."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "jyhuang201900" }]
keywords = [
    "remote-sensing",
    "forest-segmentation",
    "deep-learning",
    "reinforcement-learning",
    "kh-4",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: GIS",
    "Topic :: Scientific/Engineering :: Image Processing",
]
dynamic = ["version"]
dependencies = [
    "numpy>=1.24",
    "scipy>=1.10",
    "rasterio>=1.3",
    "scikit-image>=0.22",
    "scikit-learn>=1.3",
    "PyYAML>=6.0",
    "tqdm>=4.66",
    "shapely>=2.0",
    "geopandas>=0.14",
    "fiona>=1.9",
]

[project.optional-dependencies]
torch = [
    "torch>=2.2",
    "torchvision>=0.17",
    "segmentation-models-pytorch>=0.3.3",
]
rl = [
    "gymnasium>=0.29",
    "stable-baselines3>=2.3",
]
all = [
    "forestseg[torch,rl]",
]
test = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
]
dev = [
    "forestseg[test]",
    "ruff>=0.7",
    "mypy>=1.11",
    "pre-commit>=3.8",
    "types-PyYAML",
]

[project.scripts]
forestseg = "forestseg.cli:main"

[project.urls]
Homepage = "https://github.com/jyhuang201900/dp-1"
Issues = "https://github.com/jyhuang201900/dp-1/issues"

[tool.hatch.version]
path = "src/forestseg/_version.py"

[tool.hatch.build.targets.wheel]
packages = ["src/forestseg"]

[tool.hatch.build.targets.wheel.force-include]
"src/forestseg/py.typed" = "forestseg/py.typed"

[tool.hatch.build.targets.sdist]
include = [
    "src/forestseg",
    "configs",
    "scripts",
    "docs",
    "tests",
    "README.md",
    "LICENSE",
    "CHANGELOG.md",
]

[tool.ruff]
line-length = 120
target-version = "py310"
src = ["src"]
extend-exclude = [
    "**/__pycache__",
    ".venv",
    "build",
    "dist",
]

[tool.ruff.lint]
select = [
    "E",    # pycodestyle errors
    "W",    # pycodestyle warnings
    "F",    # pyflakes
    "I",    # isort
    "B",    # flake8-bugbear
    "UP",   # pyupgrade
    "C4",   # flake8-comprehensions
    "PIE",  # flake8-pie
    "RET",  # flake8-return
    "SIM",  # flake8-simplify
    "RUF",  # ruff-specific
]
ignore = [
    "E501",   # line-too-long (handled by formatter; long error strings are unavoidable)
    "B008",   # function calls in defaults
    "B904",   # raise ... from err (legacy code keeps original tracebacks)
    "SIM108", # ternary if/else (sometimes harder to read)
    "RUF001", # ambiguous unicode in strings (Chinese error messages are intentional)
    "RUF002", # ambiguous unicode in docstrings
    "RUF003", # ambiguous unicode in comments
    "RET504", # unnecessary assignment before return (readability)
    "RET505", # unnecessary `else` after return
    "SIM102", # nested if (clearer when validation chains)
    "SIM103", # needless boolean wrap (sometimes clearer)
    "SIM117", # nested with (sometimes clearer)
    "C401",   # set comprehension preferred over generator
    "C408",   # unnecessary dict() call
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["B011", "B017", "SIM", "RUF043"]
"src/forestseg/cli.py" = ["C901"]  # legacy CLI complexity

[tool.ruff.lint.isort]
known-first-party = ["forestseg"]
combine-as-imports = true

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "lf"

[tool.mypy]
python_version = "3.10"
files = ["src/forestseg"]
exclude = ["build/", "dist/", ".venv/"]
warn_unused_configs = true
warn_redundant_casts = true
follow_imports = "skip"
ignore_missing_imports = true
allow_redefinition = true
# Codes kept here are the ones that actually fire on the current tree.
# All in-repo fixable codes (var-annotated, no-redef, assignment, operator,
# arg-type) have been addressed inline. The two remaining disables are
# purely about third-party stub gaps (rasterio, geopandas, etc.).
disable_error_code = [
    "import-untyped",
    "import-not-found",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = [
    "-ra",
    "--strict-markers",
    "--strict-config",
]
filterwarnings = [
    "ignore::DeprecationWarning",
    "ignore::PendingDeprecationWarning",
]
markers = [
    "slow: marks tests as slow",
    "requires_torch: requires torch to be installed",
]

[tool.coverage.run]
branch = true
source = ["src/forestseg"]
omit = [
    "src/forestseg/_version.py",
    "src/forestseg/__main__.py",
]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
    "if TYPE_CHECKING:",
]
