# =============================================================================
# Cross-platform example pipeline configuration for forestseg / dp-1.
#
# Paths are relative to the directory you launch the CLI from. Copy this file
# to e.g. `configs/pipeline.local.yaml`, edit paths to match your environment,
# and pass it via `--config configs/pipeline.local.yaml`.
#
# For the original Windows-specific layout used in upstream `dp`, see
# `configs/pipeline.windows.yaml`.
# =============================================================================

# Root directory of the project on disk (used as a base for some helper paths).
project_root: ./data

# Scene definition script. Generated by your preprocessing step; it exposes
# scene-specific variables (input rasters, CRS, etc.) consumed by the
# pipeline. See `docs/labeling_workflow.md` for the expected contents.
scene_sh: ./data/input/config/scene.sh

# Intermediate-artifact working directory (checkpoints, fusion probabilities,
# RL history, etc.). Will be created on first run.
work_dir: ./work

# Final export directory (clean GeoTIFF mask + vector polygons).
output_dir: ./outputs

input:
  # Prefer the high-quality "v1" preprocessing pipeline.
  prefer_v1: true
  # Fall back to a faster "quick" pipeline if v1 is unavailable.
  fallback_quick: true

preprocess:
  # Percentile clip used during intensity normalization.
  clip_percentiles: [2, 98]
  # Master switch for radiometric normalization.
  normalize: true

labels:
  # Positive (forest) label points as a vector file (GPKG / SHP / GeoJSON).
  positive_path: ./data/labels/label_points.gpkg
  # Negative (non-forest) label points.
  negative_path: ./data/labels/label_points_0.gpkg
  # Layer name inside the vector file.
  layer: labels
  # Attribute column carrying the class value.
  class_field: class
  # Class value that means "forest".
  positive_value: 1
  # Class value that means "non-forest".
  negative_value: 0
  # Train/validation split ratio (training share).
  split_ratio: 0.7
  # Grid cell size (meters) for spatial split — should be larger than typical
  # tile size to limit train/val leakage.
  grid_size: 1000.0
  # Random seed for the spatial split.
  split_seed: 42

dem:
  # Optional DEM raster aligned with the input image. Set to null to disable.
  path: null

spectral:
  # Quantile threshold for the spectral prior.
  quantile: 0.35
  # Component weights — must sum to ~1.0 for a calibrated probability.
  otsu_weight: 0.4
  quantile_weight: 0.3
  local_weight: 0.3
  # Local-statistic window size (odd numbers preferred).
  local_block_size: 51

texture:
  # Multi-scale texture window sizes (pixels).
  windows: [7, 15, 31]
  # Local Binary Pattern parameters.
  lbp_radius: 1
  lbp_points: 8

dl:
  # ----- DeepLearning training / inference -----
  encoder_name: resnet34
  # Trained checkpoint location (created during training).
  checkpoint_path: ./work/checkpoints/best.pt

  # Inference tiling: larger tile_size → more context, more memory.
  tile_size: 512
  # Stride must be <= tile_size. Lower stride → smoother seams, slower.
  stride: 256
  # Mini-batch size for both training and inference.
  batch_size: 8

  # Training schedule.
  epochs: 8
  learning_rate: 0.0003
  weight_decay: 0.0001
  max_patches: 2000
  aux_warmup_epochs: 0

  # MC Dropout passes during inference (≥1; higher → smoother uncertainty,
  # roughly linear cost).
  mc_dropout_passes: 2

  # Training patch size around each label point.
  sample_tile_size: 256

  # Probability threshold used at validation time only.
  val_threshold: 0.5
  # Metric used to keep the best checkpoint (f1 / precision / recall / iou).
  selection_metric: f1
  # Random seed for reproducibility.
  seed: 42

  # Recommended presets (commented; copy into the block above to enable):
  # [A] Speed-first
  # tile_size: 512
  # stride: 512
  # batch_size: 16
  # mc_dropout_passes: 1
  #
  # [B] Balanced
  # tile_size: 512
  # stride: 384
  # batch_size: 12
  # mc_dropout_passes: 1

fusion:
  # Stage 1 = grid search over the candidates in `grid` below.
  stage: 1

  # Fallback / stage-0 fixed parameters.
  fixed_params:
    lambda_spec: 0.2
    lambda_tex: 0.2
    threshold: 0.5
    min_area_m2: 200
    morph_kernel: 3
    shadow_penalty: 0.5

  # Stage-1 grid search candidates. Each list is enumerated; total cost is
  # the product of list lengths.
  grid:
    lambda_spec: [0.1, 0.2, 0.3]
    lambda_tex: [0.1, 0.2, 0.3]
    threshold: [0.5, 0.55, 0.6]
    min_area_m2: [300, 500, 800]
    morph_kernel: [3, 5]
    shadow_penalty: [0.3, 0.5, 0.7]

rl_loop:
  # Number of closed-loop RL rounds.
  rounds: 2
  # Early stop if no improvement for this many rounds.
  patience: 2
  # Minimum improvement to count as progress.
  min_delta: 0.001
  # Metric used to drive RL selection (reward / f1 / precision / recall / iou).
  selection_metric: precision

postprocess:
  # Morphological kernel sizes (pixels).
  opening_kernel: 5
  closing_kernel: 7
